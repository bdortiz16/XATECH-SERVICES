<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XATECH P2P — Acceso</title>
  <link rel="icon" type="image/svg+xml" href="logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0e14; --panel: #10141c; --border: #232a36;
      --text: #e6e9ef; --muted: #9aa4b5;
      --accent: #6592ea; --accent-dark: #4d7de0; --accent-2: #58bcd1;
      --mono: "JetBrains Mono", monospace;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Hanken Grotesk", system-ui, sans-serif;
      background:
        radial-gradient(ellipse 55% 45% at 30% 0%, rgba(101,146,234,.10), transparent),
        radial-gradient(ellipse 45% 40% at 85% 100%, rgba(88,188,209,.08), transparent),
        var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .card {
      width: min(400px, 100%);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 2.4rem 2.2rem;
      box-shadow: 0 30px 80px rgba(0,0,0,.5);
    }
    .brand { display: flex; align-items: center; gap: .7rem; margin-bottom: .4rem; }
    .brand strong { font-size: 1.15rem; font-weight: 800; letter-spacing: .02em; }
    .brand strong em { font-style: normal; color: var(--accent); }
    .sub {
      font-family: var(--mono);
      font-size: .72rem;
      color: var(--accent-2);
      margin-bottom: 1.8rem;
      display: block;
    }
    .sub::before { content: "// "; opacity: .6; }
    h1 { font-size: 1.35rem; font-weight: 800; margin-bottom: .3rem; }
    .hint { color: var(--muted); font-size: .88rem; margin-bottom: 1.6rem; }
    label { display: block; font-size: .85rem; font-weight: 600; margin: 1rem 0 .35rem; }
    input {
      width: 100%;
      padding: .65rem .85rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-family: inherit;
      font-size: .95rem;
    }
    input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(101,146,234,.25); }
    button {
      width: 100%;
      margin-top: 1.5rem;
      padding: .75rem;
      background: var(--accent);
      color: #fff;
      font-weight: 700;
      font-size: .97rem;
      font-family: inherit;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background .15s;
    }
    button:hover { background: var(--accent-dark); }
    button:disabled { opacity: .6; cursor: wait; }
    .error {
      margin-top: .9rem;
      color: #f08a8a;
      font-size: .85rem;
      min-height: 1.2rem;
      text-align: center;
    }
    .foot {
      margin-top: 1.4rem;
      text-align: center;
      color: var(--muted);
      font-family: var(--mono);
      font-size: .68rem;
    }
  </style>
</head>
<body>
  <form class="card" id="form">
    <div class="brand">
      <svg width="30" height="30" viewBox="0 0 64 64" aria-hidden="true">
        <path id="pt" d="M14 .8C21.5.1 27 5.2 27.5 12.8 28 20.5 22.9 26.9 15 27.5 7.3 28.1.9 22.6.6 14.9.3 7.4 6.5 1.5 14 .8Z" fill="none"/>
        <use href="#pt" transform="translate(2.5 3) rotate(-4 14 14)" fill="#45518f"/>
        <use href="#pt" transform="translate(34.5 2.5) rotate(6 14 14)" fill="#6592ea"/>
        <use href="#pt" transform="translate(2 34.5) rotate(5 14 14)" fill="#85aef2"/>
        <use href="#pt" transform="translate(34 34) rotate(-6 14 14)" fill="#58bcd1"/>
      </svg>
      <strong>XA<em>TECH</em></strong>
    </div>
    <span class="sub">módulo p2p · acceso restringido</span>
    <h1>Iniciar sesión</h1>
    <p class="hint">Plataforma interna de operaciones. El acceso es solo para el equipo autorizado — no hay registro de cuentas.</p>

    <label for="email">Correo</label>
    <input id="email" type="email" autocomplete="username" required>

    <label for="password">Contraseña</label>
    <input id="password" type="password" autocomplete="current-password" required>

    <button type="submit" id="btn">Entrar</button>
    <p class="error" id="error"></p>
    <p class="foot">xatech services © <span id="y"></span></p>
  </form>

  <script>
    // Si ya hay sesión activa, entrar directo al panel
    fetch('/api/me').then((r) => { if (r.ok) location.href = '/plataforma/panel.html'; }).catch(() => {});

    document.getElementById('y').textContent = new Date().getFullYear();
    const form = document.getElementById('form');
    const errorEl = document.getElementById('error');
    const btn = document.getElementById('btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.textContent = '';
      btn.disabled = true;
      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('email').value,
            password: document.getElementById('password').value,
          }),
        });
        if (res.ok) { location.href = '/plataforma/panel.html'; return; }
        const data = await res.json().catch(() => ({}));
        errorEl.textContent = data.error || 'No se pudo iniciar sesión';
      } catch {
        errorEl.textContent = 'Error de conexión con el servidor';
      }
      btn.disabled = false;
    });
  </script>
</body>
</html>
